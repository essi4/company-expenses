name: Cloudflare Auth Diagnostic

on:
  push:
    branches:
      - feature/d1-data-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_NAME: company-expenses
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Check token identity
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); r=d.get("result") or {}; print("token_status="+str(r.get("status"))); print("token_id_present="+str(bool(r.get("id"))))'
          echo "$body" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("success") else 1)'

      - name: Check Worker resource
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w "%{http_code}" "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")"
          echo "worker_http_status=$code"
          python - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print("worker_success="+str(d.get("success")))
          for e in d.get("errors", []):
              print("worker_error_code="+str(e.get("code")))
              print("worker_error_message="+str(e.get("message")))
          PY
          rm -f "$tmp"

      - name: Check Worker Secrets endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets"
          tmp="$(mktemp)"
          code="$(curl -sS -o "$tmp" -w "%{http_code}" "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")"
          echo "secrets_http_status=$code"
          python - "$tmp" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          print("secrets_success="+str(d.get("success")))
          print("secret_result_count="+str(len(d.get("result") or [])) if isinstance(d.get("result"), list) else "secret_result_type="+str(type(d.get("result")).__name__))
          for e in d.get("errors", []):
              print("secrets_error_code="+str(e.get("code")))
              print("secrets_error_message="+str(e.get("message")))
          PY
          rm -f "$tmp"
          test "$code" -lt 400
