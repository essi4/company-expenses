name: Cloudflare D1 Bootstrap

on:
  push:
    branches:
      - "feature/d1-migration-foundation"
  workflow_dispatch:

jobs:
  bootstrap-d1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_NAME: company-expenses

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/d1-migration-foundation
          fetch-depth: 1

      - name: Bootstrap D1 when explicitly requested
        shell: bash
        run: |
          set -euo pipefail

          request="$(git log -1 --pretty=%s)"
          if [[ "$request" != "chore(d1): bootstrap remote"* ]]; then
            echo "No D1 bootstrap request in this commit; exiting safely."
            exit 0
          fi

          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }

          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database?name=$DB_NAME&per_page=100")"

          python3 - "$response" <<'PY' > /tmp/d1_uuid
import json
import sys

payload = json.loads(sys.argv[1])
if not payload.get("success", False):
    raise SystemExit("Cloudflare API returned success=false")

items = payload.get("result") or []
if len(items) > 1:
    raise SystemExit(f"Refusing to continue: found {len(items)} D1 databases named company-expenses")

if items:
    uuid = items[0].get("uuid")
    if not uuid:
        raise SystemExit("Existing D1 database has no UUID in API response")
    print(uuid)
PY

          if [[ ! -s /tmp/d1_uuid ]]; then
            response="$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              --data '{"name":"company-expenses"}')"

            python3 - "$response" <<'PY' > /tmp/d1_uuid
import json
import sys

payload = json.loads(sys.argv[1])
if not payload.get("success", False):
    raise SystemExit(json.dumps(payload.get("errors", []), ensure_ascii=False))

uuid = (payload.get("result") or {}).get("uuid")
if not uuid:
    raise SystemExit("Cloudflare create response did not contain a UUID")

print(uuid)
PY
          fi

          UUID="$(cat /tmp/d1_uuid)"

          python3 - "$UUID" <<'PY'
from pathlib import Path
import re
import sys

uuid = sys.argv[1]
path = Path("wrangler.jsonc")
text = path.read_text(encoding="utf-8")
updated, count = re.subn(
    r'("database_id"\s*:\s*")[^"]+(")',
    rf'\g<1>{uuid}\g<2>',
    text,
    count=1,
)
if count != 1:
    raise SystemExit("Could not locate database_id in wrangler.jsonc")
path.write_text(updated, encoding="utf-8")
PY

          node scripts/assert-real-d1.mjs
          rm -f .github/d1-bootstrap.requested

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrangler.jsonc .github/d1-bootstrap.requested

          if git diff --cached --quiet; then
            echo "D1 config already points to the real database."
            exit 0
          fi

          git commit -m "chore(d1): bind feature branch to real D1 database"
          git push origin HEAD:feature/d1-migration-foundation
