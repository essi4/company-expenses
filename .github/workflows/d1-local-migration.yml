name: D1 Migration Check

on:
  push:
    branches:
      - "feature/d1-migration-foundation"
  pull_request:
    branches:
      - master

jobs:
  d1-local-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Wrangler config
        run: npx wrangler@4.135.0 --version

      - name: List local migrations before apply
        run: npm run d1:migrations:list:local

      - name: Apply local migrations
        run: npm run d1:migrate:local

      - name: Verify local tables
        run: |
          npm run d1:tables:local
          npx wrangler@4.135.0 d1 execute company-expenses --local --command="PRAGMA table_info(purchases);"
          npx wrangler@4.135.0 d1 execute company-expenses --local --command="PRAGMA table_info(payments);"
          npx wrangler@4.135.0 d1 migrations list company-expenses --local
