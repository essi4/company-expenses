name: D1 Lockfile Sync

on:
  push:
    branches:
      - feature/d1-data-layer

permissions:
  contents: write

concurrency:
  group: d1-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/d1-data-layer
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile
        shell: bash
        run: |
          npm install --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync npm lockfile for Cloudflare runtime"
          git push origin HEAD:feature/d1-data-layer
