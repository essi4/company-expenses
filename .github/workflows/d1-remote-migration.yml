name: Cloudflare D1 Remote Migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Remote D1 action"
        required: true
        type: choice
        options:
          - inspect
          - apply
        default: inspect
      confirm:
        description: "Apply confirmation"
        required: true
        type: choice
        options:
          - APPLY-D1-MIGRATIONS
        default: APPLY-D1-MIGRATIONS

concurrency:
  group: d1-remote-migration
  cancel-in-progress: false

jobs:
  remote-migration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout migration target branch
        uses: actions/checkout@v4
        with:
          ref: feature/d1-data-layer
          fetch-depth: 1

      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          }
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"
            exit 1
          }

      - name: Verify real D1 UUID is configured
        run: node scripts/assert-real-d1.mjs

      - name: Verify migration target
        shell: bash
        run: |
          test -f migrations/0002_d1_company_finance.sql || {
            echo "::error::Migration 0002_d1_company_finance.sql is missing from feature/d1-data-layer"
            exit 1
          }
          git log -1 --oneline

      - name: Validate Wrangler
        run: npx --yes wrangler@4.135.0 --version

      - name: Inspect remote migration state
        run: npx --yes wrangler@4.135.0 d1 migrations list company-expenses --remote

      - name: Stop after inspection
        if: inputs.action == 'inspect'
        run: echo "Inspection complete. No remote migration was applied."

      - name: Validate apply confirmation
        if: inputs.action == 'apply'
        shell: bash
        run: |
          test "${{ inputs.confirm }}" = "APPLY-D1-MIGRATIONS" || {
            echo "::error::Refusing remote migration: confirmation must be exactly APPLY-D1-MIGRATIONS"
            exit 1
          }

      - name: Apply remote migrations
        if: inputs.action == 'apply'
        run: npx --yes wrangler@4.135.0 d1 migrations apply company-expenses --remote

      - name: Verify remote schema
        if: inputs.action == 'apply'
        run: |
          npx --yes wrangler@4.135.0 d1 execute company-expenses --remote --command="SELECT name FROM sqlite_master WHERE type='table' ORDER BY name;"
          npx --yes wrangler@4.135.0 d1 execute company-expenses --remote --command="SELECT name FROM sqlite_master WHERE type='index' ORDER BY name;"
          npx --yes wrangler@4.135.0 d1 execute company-expenses --remote --command="SELECT name FROM d1_migrations ORDER BY applied_at, name;"
          npx --yes wrangler@4.135.0 d1 migrations list company-expenses --remote
