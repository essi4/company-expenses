name: EASY 138-150 Verify
on:
  push:
    branches: ["feature/easy-138-150-implementation"]
  pull_request:
    branches: ["master"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
